name = "urupema-imoveis"
pages_build_output_dir = "./public"
compatibility_date = "2026-11-01"
# A conta fica fixada em CLOUDFLARE_ACCOUNT_ID no .env (o Pages recusa account_id aqui).

[[d1_databases]]
binding = "DB"
database_name = "urupema"
database_id = "8cdd6966-4a4c-411f-b4c8-44f221be2f40"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "FOTOS"
id = "56fbce438c81402bbea8d8d1b2c97959"

[vars]
SITE_URL = "https://urupema-imoveis.pages.dev"
INSTAGRAM_MODO = "mock"        # mock | real
EMAIL_MODO = "mock"            # mock | real (real só depois que o domínio estiver na Cloudflare)
IG_API_VERSION = "v23.0"       # [CONFERIR] a versão atual da Graph API do Instagram (marco M9)
